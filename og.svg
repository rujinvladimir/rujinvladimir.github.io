<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%" gradientUnits="userSpaceOnUse" fx="600" fy="315">
      <stop offset="0%" stop-color="#0f1e36"/>
      <stop offset="100%" stop-color="#060a13"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#edd98a"/>
      <stop offset="40%" stop-color="#c8a84b"/>
      <stop offset="100%" stop-color="#8a6a1e"/>
    </linearGradient>
    <radialGradient id="glowV" cx="40%" cy="45%" r="35%" gradientUnits="userSpaceOnUse" fx="490" fy="290">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="60%" cy="45%" r="35%" gradientUnits="userSpaceOnUse" fx="700" fy="290">
      <stop offset="0%" stop-color="#c8a84b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c8a84b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient letter glows -->
  <ellipse cx="500" cy="310" rx="260" ry="220" fill="url(#glowV)"/>
  <ellipse cx="700" cy="310" rx="260" ry="220" fill="url(#glowR)"/>

  <!-- Outer border -->
  <rect x="34" y="34" width="1132" height="562" fill="none" stroke="#c8a84b" stroke-width="0.7" opacity="0.2"/>
  <!-- Inner border -->
  <rect x="46" y="46" width="1108" height="538" fill="none" stroke="#c8a84b" stroke-width="0.35" opacity="0.1"/>

  <!-- Corner brackets — top left -->
  <polyline points="34,88 34,34 88,34" fill="none" stroke="#c8a84b" stroke-width="1.8" opacity="0.55"/>
  <!-- Corner brackets — top right -->
  <polyline points="1112,34 1166,34 1166,88" fill="none" stroke="#c8a84b" stroke-width="1.8" opacity="0.55"/>
  <!-- Corner brackets — bottom left -->
  <polyline points="34,542 34,596 88,596" fill="none" stroke="#c8a84b" stroke-width="1.8" opacity="0.55"/>
  <!-- Corner brackets — bottom right -->
  <polyline points="1112,596 1166,596 1166,542" fill="none" stroke="#c8a84b" stroke-width="1.8" opacity="0.55"/>

  <!-- Thin horizontal rules flanking letters -->
  <line x1="100" y1="175" x2="420" y2="175" stroke="#c8a84b" stroke-width="0.5" opacity="0.18"/>
  <line x1="780" y1="175" x2="1100" y2="175" stroke="#c8a84b" stroke-width="0.5" opacity="0.18"/>
  <line x1="100" y1="460" x2="420" y2="460" stroke="#c8a84b" stroke-width="0.5" opacity="0.18"/>
  <line x1="780" y1="460" x2="1100" y2="460" stroke="#c8a84b" stroke-width="0.5" opacity="0.18"/>

  <!-- R — drawn first (behind V) -->
  <text
    x="672"
    y="448"
    font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
    font-size="376"
    font-weight="400"
    fill="url(#goldGrad)"
    text-anchor="middle"
    letter-spacing="-8"
  >R</text>

  <!-- V — drawn second (in front, right leg crosses R) -->
  <text
    x="528"
    y="448"
    font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
    font-size="376"
    font-weight="400"
    fill="white"
    text-anchor="middle"
    letter-spacing="-8"
  >V</text>

  <!-- Center ornament line -->
  <line x1="340" y1="500" x2="590" y2="500" stroke="#c8a84b" stroke-width="0.5" opacity="0.22"/>
  <line x1="610" y1="500" x2="860" y2="500" stroke="#c8a84b" stroke-width="0.5" opacity="0.22"/>
  <!-- Diamond -->
  <polygon points="600,493 607,500 600,507 593,500" fill="none" stroke="#c8a84b" stroke-width="0.8" opacity="0.5"/>
</svg>
